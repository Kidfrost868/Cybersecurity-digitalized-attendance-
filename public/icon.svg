<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle with Safe Margin -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="236" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.3" stroke-dasharray="12 12" />

  <!-- Outer Radar Pulse Rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.2" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.3" />

  <!-- Cybersecurity Shield Symbol -->
  <g filter="url(#glow)">
    <path d="M 256 90 L 370 140 C 370 250 320 340 256 390 C 192 340 142 250 142 140 Z"
          fill="url(#shieldGrad)" />
    <!-- Inner Shield Inset -->
    <path d="M 256 114 L 348 154 C 348 244 308 318 256 360 C 204 318 164 244 164 154 Z"
          fill="#09141f" />
  </g>

  <!-- Cyber Circuit & Lock Motif Inside Shield -->
  <g stroke="#34d399" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M 216 220 L 216 195 C 216 173 234 155 256 155 C 278 155 296 173 296 195 L 296 220" />
    <rect x="206" y="220" width="100" height="74" rx="14" fill="#10b981" stroke="none" />
    <circle cx="256" cy="250" r="7" fill="#022c22" stroke="none" />
    <path d="M 256 257 L 256 272" stroke="#022c22" stroke-width="4" />
  </g>

  <!-- GPS Crosshairs / Location Pin Accent -->
  <circle cx="256" cy="326" r="10" fill="#34d399" />
  <circle cx="256" cy="326" r="18" fill="none" stroke="#34d399" stroke-width="3" stroke-opacity="0.6" />

  <!-- RUN University Typography -->
  <text x="256" y="445"
        text-anchor="middle"
        font-family="system-ui, -apple-system, sans-serif"
        font-weight="800"
        font-size="28"
        letter-spacing="5"
        fill="#ffffff">RUN CYBERPASS</text>
  <text x="256" y="475"
        text-anchor="middle"
        font-family="system-ui, -apple-system, sans-serif"
        font-weight="600"
        font-size="14"
        letter-spacing="3"
        fill="#34d399">REDEEMER'S UNIVERSITY</text>
</svg>
